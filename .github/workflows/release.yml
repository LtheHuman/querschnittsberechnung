name: Release

# Baut fertige Programme für Windows, macOS und Linux, sobald ein Versions-Tag
# (z. B. v2.0.0) gepusht wird, und hängt sie an ein GitHub-Release.
# Manuell starten (ohne Release) geht über "Actions → Release → Run workflow".

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows }
          - { os: macos-14,       name: macOS }
          - { os: ubuntu-22.04,   name: Linux }
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Qt-Systembibliotheken (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Abhängigkeiten
        run: pip install . pyinstaller pillow pytest

      - name: Tests
        run: pytest -q

      - name: Programm bauen
        run: pyinstaller packaging/querschnitt.spec --noconfirm

      - name: Selbsttest & Paket (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/Querschnittsberechnung/Querschnittsberechnung.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Selbsttest fehlgeschlagen ($($p.ExitCode))" }
          Compress-Archive -Path dist/Querschnittsberechnung -DestinationPath Querschnittsberechnung-Windows.zip

      - name: Selbsttest & Paket (macOS)
        if: runner.os == 'macOS'
        run: |
          dist/Querschnittsberechnung.app/Contents/MacOS/Querschnittsberechnung --selftest
          ditto -c -k --keepParent dist/Querschnittsberechnung.app Querschnittsberechnung-macOS.zip

      - name: Selbsttest & Paket (Linux)
        if: runner.os == 'Linux'
        run: |
          dist/Querschnittsberechnung/Querschnittsberechnung --selftest
          tar czf Querschnittsberechnung-Linux.tar.gz -C dist Querschnittsberechnung

      - uses: actions/upload-artifact@v4
        with:
          name: Querschnittsberechnung-${{ matrix.name }}
          path: Querschnittsberechnung-*.*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: Querschnittsberechnung-*.*
          generate_release_notes: true
          body: |
            ## Download

            | System | Datei |
            |---|---|
            | Windows 10/11 | `Querschnittsberechnung-Windows.zip` |
            | macOS (Apple Silicon, M1 und neuer) | `Querschnittsberechnung-macOS.zip` |
            | Linux (x86-64) | `Querschnittsberechnung-Linux.tar.gz` |

            Entpacken und starten – Python wird **nicht** benötigt.
            Hinweise zum ersten Start (Windows-SmartScreen, macOS-Gatekeeper) stehen im
            [README](https://github.com/LtheHuman/querschnittsberechnung#download).
