[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "querschnittsberechnung"
dynamic = ["version"]
description = "Symbolische Querschnittswerte und Normalspannungen beliebiger Polygone (BM2, TU Graz)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5", "sympy>=1.12", "numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.gui-scripts]
querschnitt = "querschnitt.app:main"

[tool.setuptools]
packages = ["querschnitt", "querschnitt.ui"]

[tool.setuptools.dynamic]
version = { attr = "querschnitt.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
